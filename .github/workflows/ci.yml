name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web (lint / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # ビルドゲート用ダミー値（本番ビルドはVercel側で実値を注入する）
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  ios:
    name: iOS (SwiftLint / build / test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        working-directory: ios
        run: |
          brew install swiftlint
          swiftlint --quiet
      - name: Build
        working-directory: ios/questBoard
        run: |
          xcodebuild build \
            -project questBoard.xcodeproj \
            -scheme questBoard \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
      - name: Test (unit tests)
        working-directory: ios/questBoard
        run: |
          xcodebuild test \
            -project questBoard.xcodeproj \
            -scheme questBoard \
            -destination 'platform=macOS' \
            -only-testing:questBoardTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
